services:
  postgres:
    image: postgres:18.6-alpine
    container_name: hello-security-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hello_security}
      POSTGRES_USER: ${POSTGRES_USER:-hello}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hello1234}
      TZ: Asia/Seoul
    ports:
      # 로컬에 이미 5432 를 쓰는 PostgreSQL 이 있어도 충돌하지 않도록 호스트 포트는 15432 를 기본값으로 한다
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 이미지부터 데이터 디렉토리가 /var/lib/postgresql/18/docker 로 바뀌었으므로
      # 상위 디렉토리(/var/lib/postgresql)를 마운트한다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
