<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 관리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<h1>회원 관리 (ADMIN)</h1>

<table>
    <thead>
    <tr><th>id</th><th>username</th><th>nickname</th><th>role</th><th>가입일</th></tr>
    </thead>
    <tbody>
    <tr th:each="m : ${members}">
        <td th:text="${m.id}"></td>
        <td th:text="${m.username}"></td>
        <td th:text="${m.nickname}"></td>
        <td th:text="${m.role}"></td>
        <td th:text="${m.createdAt}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
