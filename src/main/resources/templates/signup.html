<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<h1>회원가입</h1>

<form th:action="@{/signup}" th:object="${form}" method="post">
    <label for="username">아이디 (영문 소문자/숫자/_ 4~50자)</label>
    <input id="username" th:field="*{username}" type="text" autocomplete="username" required>
    <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

    <label for="password">비밀번호 (8~64자)</label>
    <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required>
    <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

    <label for="nickname">닉네임</label>
    <input id="nickname" th:field="*{nickname}" type="text" required>
    <p class="error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>

    <button type="submit">가입하기</button>
</form>
</body>
</html>
